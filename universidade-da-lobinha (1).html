    <div class="grid g-2">
      <div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><h3 style="font-size:15px;font-weight:800">Meta semanal</h3><label class="muted" style="font-size:13px;display:flex;gap:6px;align-items:center"><input class="input" type="number" min="1" max="40" data-meta="semanal" value="${meta.semanal}" style="width:70px;height:34px"> horas</label></div><div class="bar" style="margin:12px 0 6px"><i style="width:${Math.min(100, (ms / (meta.semanal * 60)) * 100)}%"></i></div><span class="muted" style="font-size:13px">${fmtHoras(ms)} de ${meta.semanal}h</span></div>
      <div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><h3 style="font-size:15px;font-weight:800">Meta mensal</h3><label class="muted" style="font-size:13px;display:flex;gap:6px;align-items:center"><input class="input" type="number" min="1" max="160" data-meta="mensal" value="${meta.mensal}" style="width:70px;height:34px"> horas</label></div><div class="bar" style="margin:12px 0 6px"><i style="width:${Math.min(100, (mm / (meta.mensal * 60)) * 100)}%"></i></div><span class="muted" style="font-size:13px">${fmtHoras(mm)} de ${meta.mensal}h</span></div>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin:26px 0 12px;gap:10px;flex-wrap:wrap"><h2 class="section-title" style="margin:0">Semana atual</h2><button class="btn sm" data-action="nova-semana">↺ Começar nova semana</button></div>

    const media = (ids) => Math.round(ids.reduce((a, id) => a + Calc.trilhaPct(id), 0) / ids.length);
    const st = D.roadmap.map((e) => {
      let prog = 100;
      if (e.trilhas) prog = Math.min(100, Math.round((media(e.trilhas) / e.alvo) * 100));
      if (e.id === 'cons') prog = Math.round(((Math.min(3, Calc.desafiosCompletos()) + Math.min(2, Calc.projetosConcluidos())) / 5) * 100);
      return { ...e, prog };
    });
    let alcancou = true;
    st.forEach((e, i) => {
      if (e.id === 'obj') e.prog = alcancou ? 100 : 0;
      e.reached = alcancou && e.prog >= 100;
      if (!e.reached) alcancou = false;
    });
    const cur = st.findIndex((e) => !e.reached);
    return { st, cur: cur === -1 ? st.length - 1 : cur };
  }

  let srAtivo = 0; let srItens = [];
  function buscar(q) {

    if (!nq) {
      srItens = Calc.proximasTarefas(4).map(({ m }) => ({ g: 'Sugestões para agora', i: m.trilha.icone, t: m.t, s: m.trilha.nome, go: `#/trilhas/${m.trilha.id}/${m.id}` }))
        .filter((x, i, a) => a.findIndex((y) => y.t === x.t) === i);
    } else {
      const termos = nq.split(/\s+/);
      srItens = indice().concat(projetosIndice())
        .map((x) => ({ x, sc: termos.every((t) => x.n.includes(t)) ? (x.nt.includes(nq) ? 3 : x.nt.includes(termos[0]) ? 2 : 1) : 0 }))
        .filter((r) => r.sc > 0).sort((a, b) => b.sc - a.sc).slice(0, 30).map((r) => r.x);
    }
    srAtivo = 0;
    const hl = (s) => { let out = esc(s); if (!nq) return out; nq.split(/\s+/).filter((t) => t.length > 1).forEach((t) => { const re = new RegExp('(' + t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi'); out = out.replace(re, '<mark>$1</mark>'); }); return out; };

  const Foco = { dur: 25, fim: 0, restante: 25 * 60, rodando: false, timer: null, label: 'Estudo livre', task: null };

  function pintarFoco() {

    const C = 2 * Math.PI * 140; $('#focoArc').setAttribute('stroke-dashoffset', C * (1 - r / (Foco.dur * 60)));

  }
  function playFoco() {

          const ta = $('#dsText'); ta.select();
          const ok = () => toast('Dados copiados. Agora é só colar no Excel 📋');
          if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(ta.value).then(ok, () => { try { document.execCommand('copy'); ok(); } catch (er) { toast('Selecione o texto e copie com Ctrl+C.'); } });
          else { try { document.execCommand('copy'); ok(); } catch (er) { toast('Selecione o texto e copie com Ctrl+C.'); } }
        },
        'proj-novo': () => editarProjeto(null),
        'proj-edit': () => editarProjeto(act.dataset.id),
        'proj-del': () => { if (!confirm('Excluir este projeto?')) return; Store.update((s) => { s.portfolio = s.portfolio.filter((p) => p.id !== act.dataset.id); }); closeModal(); render(); },
        'proj-avancar': () => {
          const p = Store.s.portfolio.find((x) => x.id === act.dataset.id); if (!p) return;
          const novo = p.status === 'ideia' ? 'andamento' : 'concluido';
          Store.update(() => { p.status = novo; p.atualizado = now(); });
          if (novo === 'concluido') { toast('Projeto concluído! Mais um para o portfólio 💼 <span class="x">+80 XP</span>', true); confetti(60); } else toast('Projeto em andamento. Bora! 🚀');
          checarBadges(); render();
        },
        'plano-del': () => { e.preventDefault(); Store.update((s) => { s.plano[act.dataset.dia] = s.plano[act.dataset.dia].filter((x) => x.id !== act.dataset.id); }); render(); },
        'nova-semana': () => { if (!confirm('Desmarcar todas as tarefas da semana?')) return; Store.update((s) => Object.values(s.plano).forEach((l) => l.forEach((x) => { x.done = false; }))); render(); },
        'road-stop': () => { act.classList.toggle('open'); ajustarRoad(); },
        'foto-remover': () => { Store.update((s) => { s.perfil.foto = null; }); render(); },
        'foto-padrao': () => { Store.update((s) => { s.perfil.foto = 'padrao'; }); render(); },
        'msg-nova': () => editarMensagem(null),
        'msg-edit': () => editarMensagem(act.dataset.id),
        'msg-del': () => { if (!confirm('Excluir este recadinho?')) return; Store.update((s) => { const era = s.mensagens.find((m) => m.id === act.dataset.id); s.mensagens = s.mensagens.filter((m) => m.id !== act.dataset.id); if (era && era.fixada && s.mensagens.length) s.mensagens[s.mensagens.length - 1].fixada = true; }); render(); },
        'msg-fixar': () => { Store.update((s) => s.mensagens.forEach((m) => { m.fixada = m.id === act.dataset.id; })); toast('Recadinho fixado no início 📌'); render(); },
        'backup-export': () => {
          let code = ''; try { code = btoa(unescape(encodeURIComponent(JSON.stringify(Store.s)))); } catch (er) { code = ''; }
          openModal(`<h2>Código de backup</h2><p class="muted">Copie tudo e guarde (ou cole no outro aparelho em "Restaurar de um backup").</p><textarea class="textarea" id="bkText" readonly rows="8" style="font:12px ui-monospace,monospace">${esc(code)}</textarea><div class="modal-actions"><button class="btn" data-action="close-modal">Fechar</button><button class="btn primary" data-action="bk-copy">Copiar código</button></div>`);
        },
        'bk-copy': () => { const ta = $('#bkText'); ta.select(); try { (navigator.clipboard ? navigator.clipboard.writeText(ta.value) : Promise.reject()).then(() => toast('Código copiado'), () => { document.execCommand('copy'); toast('Código copiado'); }); } catch (er) { toast('Selecione e copie com Ctrl+C.'); } },
        'backup-import': () => openModal(`<h2>Restaurar backup</h2><form id="bkForm"><textarea class="textarea" name="code" rows="8" placeholder="Cole aqui o código de backup" required></textarea><div class="modal-actions"><button type="button" class="btn" data-action="close-modal">Cancelar</button><button class="btn primary" type="submit">Restaurar</button></div></form>`),
        'reset': () => { if (!confirm('Isso apaga todo o progresso deste navegador. Tem certeza?')) return; StorageAdapter.clear(); Store.init(); toast('Tudo zerado. Um novo começo 💜'); go('#/comecar'); },
      };
      if (handlers[a]) { handlers[a](); if (a !== 'close-modal' || !goEl) return; }
    }
    if (goEl) { e.preventDefault(); fecharSheet(); go(goEl.dataset.go); return; }
    const sr = e.target.closest('[data-sr]'); if (sr) escolherResultado(+sr.dataset.sr);
    if (e.target.id === 'searchOverlay') fecharBusca();
    if (e.target.id === 'modal') closeModal();
  });
  function fecharSheet() { $('#sheet').classList.remove('open'); $('#sheetBackdrop').classList.remove('open'); }

  document.addEventListener('change', (e) => {
    const t = e.target;
    if (t.id === 'mascoteToggle') { MascotTransition.setEnabled(t.checked); toast(t.checked ? 'Seu companheiro de jornada voltou 💜' : 'Mascote só nos momentos especiais'); return; }
    if (t.dataset.task) { const [mid, k] = t.dataset.task.split(':'); t.closest('.check')?.classList.add('pop'); setTimeout(() => toggleTarefa(mid, k, t.checked), 140); return; }
    if (t.dataset.dz) {
      const id = t.dataset.dz; const i = t.dataset.step; const d = D.desafios.find((x) => x.id === id);
      const eraCompleto = Calc.desafioCompleto(id);
      Store.update((s) => {
        const st = s.desafios[id] = s.desafios[id] || { passos: {} };
        if (t.checked) st.passos[i] = now(); else delete st.passos[i];
        st.done = Object.keys(st.passos).length === d.passos.length ? (st.done || now()) : null;
      });
      if (!eraCompleto && Calc.desafioCompleto(id)) MascotTransition('challenge-complete', { xp: 30 });
      else if (t.checked) toast('Passo concluído ✓ <span class="x">+10 XP</span>');
      checarBadges(); render(); return;
    }
    if (t.dataset.plano) { Store.update((s) => { const it = s.plano[t.dataset.plano].find((x) => x.id === t.dataset.id); if (it) it.done = t.checked; }); render(); return; }
    if (t.dataset.meta) { const v = Math.max(1, Math.min(200, parseInt(t.value, 10) || 1)); Store.update((s) => { s.metas[t.dataset.meta] = v; }); render(); return; }
    if (t.dataset.filter && t.tagName === 'SELECT') { filtrosCurso[t.dataset.filter] = t.value; render(); return; }
    if (t.id === 'fotoInput') { processarFoto(t.files && t.files[0]); return; }
    if (t.id === 'focoSel') { Foco.task = t.value || null; Foco.label = t.options[t.selectedIndex].text; $('#focoLabel').textContent = Foco.label; }
  });
  let filtroTimer = null;
  document.addEventListener('input', (e) => {
    const t = e.target;
    if (t.id === 'searchInput') buscar(t.value);
    if (t.dataset.filter === 'q') { clearTimeout(filtroTimer); filtroTimer = setTimeout(() => { filtrosCurso.q = t.value; render(); const i = $('[data-filter="q"]'); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); } }, 250); }
  });
  document.addEventListener('submit', (e) => {
    const f = e.target; e.preventDefault();
    const fd = Object.fromEntries(new FormData(f).entries());
    if (f.id === 'diagForm') {
      const resp = {}; D.diagnostico.forEach((q) => { if (fd[q.area] !== undefined) resp[q.area] = +fd[q.area]; });
      const primeira = !Store.s.diag;
      Store.update((s) => { s.diag = calcularDiag(resp); });
      if (primeira) toast('Diagnóstico feito! <span class="x">+20 XP</span>', true);
      checarBadges(); render();
      setTimeout(() => { const el = $('#diagResult'); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 60);
    }
    if (f.id === 'perfilForm') {
      Store.update((s) => { s.perfil.nome = fd.nome.trim() || s.perfil.nome; s.perfil.cargo = fd.cargo.trim(); s.perfil.objetivo = fd.objetivo.trim(); s.perfilSalvo = now(); });
      toast(`Perfil salvo, ${esc(primeiroNome())} 💜`, true); checarBadges(); render();
    }
    if (f.id === 'projForm') {
      const id = f.dataset.id;
      Store.update((s) => {
        if (id) { const p = s.portfolio.find((x) => x.id === id); Object.assign(p, fd); }
        else s.portfolio.unshift({ id: uid(), ...fd });
      });
      closeModal(); checarBadges(); render();
    }
    if (f.id === 'msgForm') {
      const id = f.dataset.id;
      Store.update((s) => {
        if (id) { const m = s.mensagens.find((x) => x.id === id); m.texto = fd.texto; m.assinatura = fd.assinatura; }
        else { s.mensagens.forEach((m) => { m.fixada = false; }); s.mensagens.push({ id: uid(), texto: fd.texto, assinatura: fd.assinatura || 'Seu humano', data: now(), fixada: true }); }
      });
      closeModal(); toast('Recadinho salvo 💌'); render();
    }
    if (f.dataset.planoAdd) {
      const dia = f.dataset.planoAdd; const txt = (fd.t || '').trim(); if (!txt) return;
      Store.update((s) => { s.plano[dia].push({ id: uid(), t: txt, done: false }); }); render();
      setTimeout(() => { const i = $(`[data-plano-add="${dia}"] input`); if (i) i.focus(); }, 30);
    }
    if (f.id === 'bkForm') {
      try { const data = JSON.parse(decodeURIComponent(escape(atob(fd.code.trim())))); if (!data || !data.v) throw new Error(); StorageAdapter.save(data); Store.init(); closeModal(); toast('Backup restaurado 💜', true); render(); }
      catch (er) { toast('Código inválido. Confira se copiou tudo.'); }
    }
  });
  document.addEventListener('keydown', (e) => {
    const k = e.key;
    if ((e.ctrlKey || e.metaKey) && k.toLowerCase() === 'k') { e.preventDefault(); abrirBusca(); return; }
    if (k === '/' && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) { e.preventDefault(); abrirBusca(); return; }
    if (k === 'Escape') {
      if ($('#searchOverlay').classList.contains('open')) return fecharBusca();
      if ($('#modal').classList.contains('open')) return closeModal();
      if ($('#sheet').classList.contains('open')) return fecharSheet();
      if ($('#focus').classList.contains('open')) return fecharFoco();
    }
    if ($('#searchOverlay').classList.contains('open') && srItens.length) {
      if (k === 'ArrowDown' || k === 'ArrowUp') {
        e.preventDefault(); srAtivo = (srAtivo + (k === 'ArrowDown' ? 1 : -1) + srItens.length) % srItens.length;
        $$('.sr-item').forEach((b, i) => b.classList.toggle('active', i === srAtivo)); const a = $('.sr-item.active'); if (a) a.scrollIntoView({ block: 'nearest' });
      }
      if (k === 'Enter') { e.preventDefault(); escolherResultado(srAtivo); }
    }
  });
  window.addEventListener('scroll', () => $('#topbar').classList.toggle('scrolled', window.scrollY > 4), { passive: true });
  document.addEventListener('visibilitychange', () => { if (!document.hidden && Foco.rodando) pintarFoco(); });

  /* =========================================================
     RENDER
     ========================================================= */
  let ultimaView = null;
  function render() {
    const r = rota();
    const view = Views[r.view] ? r.view : 'inicio';
    renderChrome(view);
    const main = $('#main');
    main.innerHTML = `<div class="view">${Views[view](r)}</div>`;
    if (view !== ultimaView) {
      window.scrollTo(0, 0); ultimaView = view;
      if (view === 'trilhas' && r.b) { setTimeout(() => { const el = document.getElementById('mod-' + r.b); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 80); }
      if (view === 'cursos' && r.params.get('c')) { setTimeout(() => { const el = document.getElementById('curso-' + r.params.get('c')); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 80); }
    }
    if (view === 'caminho') setTimeout(ajustarRoad, 30);
  }
  let rotaAnterior = null;
  window.addEventListener('hashchange', () => {
    const para = rota();
    const andou = MascotTransition('page-change', { from: rotaAnterior || {}, to: para });
    rotaAnterior = para;
    $('#main').classList.toggle('after-walk', andou === true);
    ultimaView = null; render();
  });
  window.addEventListener('resize', () => { if (rota().view === 'caminho') ajustarRoad(); });

  // Mantém o módulo aberto na mesma posição ao re-renderizar
  const _render = render;
  render = function () {
    const abertos = $$('details.module[open]').map((d) => d.id);
    const y = window.scrollY; const mesmaView = rota().view === ultimaView;
    _render();
    if (mesmaView) { abertos.forEach((id) => { const d = document.getElementById(id); if (d) d.open = true; }); window.scrollTo(0, y); }
  };

  /* ---------------- Boot ---------------- */
  MascotTransition('loading', { show: true });
  if (window.LobIcons) LobIcons.start();
  MascotTransition.setConfetti(confetti);
  Store.init();
  checarBadges(true);
  if (!Store.s.onboardingVisto) Store.update((s) => { s.onboardingVisto = true; });
  const primeiraVez = !MascotTransition.introVista();
  if (primeiraVez && location.hash && location.hash !== '#/inicio') history.replaceState(null, '', '#/inicio');
  rotaAnterior = rota();
  render();
  if (primeiraVez) {
    segurarBadges(MascotTransition('welcome')).then(() => { go('#/inicio'); toast(`Que bom ter você aqui, ${esc(primeiroNome())} 💜`, true); });
  } else {
    setTimeout(() => {
      if (Calc.tasksDone() > 0) toast('Bem-vinda de volta, meu pedacinho 💜', true);
      else toast(`Que bom ter você aqui, ${esc(primeiroNome())} 💜`, true);
    }, 700);
  }
})();

</script>
</body>
</html>
